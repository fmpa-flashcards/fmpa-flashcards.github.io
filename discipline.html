<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e7c86">
<title>Discipline — Flashcards FMPR</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div id="app"></div>
<script>
/* Vigie de demarrage : si l'app ne s'affiche pas (module bloque,
   navigateur trop ancien...), affiche un message d'aide au lieu d'une page blanche. */
(function () {
  var app = document.getElementById('app');
  if (!app) return;
  function card(title, body) {
    if (app.children.length) return;
    app.innerHTML =
      '<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;">' +
      '<div style="max-width:420px;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(14,124,134,.15);padding:28px 24px;text-align:center;color:#1c2733;">' +
      '<div style="font-size:2rem;margin-bottom:8px;">&#129657;</div>' +
      '<h2 style="margin:0 0 8px;font-size:1.1rem;">' + title + '</h2>' +
      '<p style="margin:0;font-size:.92rem;line-height:1.6;color:#5b6b7c;">' + body + '</p></div></div>';
  }
  var noImportMap = !('supports' in HTMLScriptElement) || !HTMLScriptElement.supports('importmap');
  if (noImportMap) {
    card('Mets \u00e0 jour ton navigateur',
      'Cette app a besoin d\u2019un navigateur r\u00e9cent. Sur iPhone : R\u00e9glages \u2192 G\u00e9n\u00e9ral \u2192 Mise \u00e0 jour logicielle, ou ouvre ce lien dans Chrome.');
    return;
  }
  setTimeout(function () {
    card('La page n\u2019arrive pas \u00e0 charger',
      'V\u00e9rifie ta connexion internet, d\u00e9sactive ton bloqueur de pub pour ce site, puis recharge la page. Si \u00e7a persiste, ouvre le lien dans Chrome ou un Safari \u00e0 jour.');
  }, 9000);
})();
</script>
</div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="js/discipline.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
